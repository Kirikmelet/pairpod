<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PairPod - Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Fredoka:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./globals.css" />
    <style>
      /* Toast notifications */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast {
        padding: 12px 20px;
        border-radius: 8px;
        font-family: 'Nunito', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
        max-width: 340px;
      }
      .toast--success { background: #3d8e22; }
      .toast--error { background: #c0392b; }
      .toast--info { background: #2c6fbb; }
      @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

      /* Loading spinner on button */
      .btn-primary.loading {
        pointer-events: none;
        opacity: 0.7;
        position: relative;
      }
      .btn-primary.loading::after {
        content: '';
        position: absolute;
        right: 16px;
        top: 50%;
        width: 16px;
        height: 16px;
        margin-top: -8px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Logged-in state */
      .logged-in-view {
        display: none;
        text-align: center;
        padding: 32px 16px;
      }
      .logged-in-view.visible { display: block; }
      .logged-in-view .welcome-msg {
        font-family: 'Fredoka', sans-serif;
        font-size: 22px;
        font-weight: 600;
        color: #2d5018;
        margin-bottom: 6px;
      }
      .logged-in-view .user-email {
        font-family: 'Nunito', sans-serif;
        font-size: 14px;
        color: #666;
        margin-bottom: 24px;
      }
      .logged-in-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .btn-home {
        display: inline-block;
        padding: 10px 28px;
        border: 2px solid #3d8e22;
        border-radius: 8px;
        background: transparent;
        color: #3d8e22;
        font-family: 'Nunito', sans-serif;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-home:hover {
        background: #3d8e22;
        color: #fff;
      }
      .btn-logout {
        display: inline-block;
        padding: 10px 28px;
        border: 2px solid #c0392b;
        border-radius: 8px;
        background: transparent;
        color: #c0392b;
        font-family: 'Nunito', sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-logout:hover {
        background: #c0392b;
        color: #fff;
      }

      /* Hide form when logged in */
      body.is-logged-in .tabs,
      body.is-logged-in .app-stack {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="sky" aria-hidden="true"></div>

    <div class="clouds" aria-hidden="true">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
      <div class="cloud cloud-5"></div>
    </div>

    <svg
      class="hills-svg"
      viewBox="0 0 1000 500"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <ellipse cx="650" cy="520" rx="620" ry="340" fill="#3d8e22"></ellipse>
      <ellipse cx="600" cy="540" rx="540" ry="300" fill="#4aa828"></ellipse>
      <ellipse cx="560" cy="530" rx="440" ry="260" fill="#5cb838"></ellipse>
      <ellipse cx="520" cy="510" rx="320" ry="190" fill="#6ebe44" opacity="0.7"></ellipse>
      <ellipse cx="500" cy="500" rx="200" ry="120" fill="#8cd960" opacity="0.45"></ellipse>
    </svg>
    <div class="ground" aria-hidden="true"></div>

    <div class="bubbles" aria-hidden="true">
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
      <div class="bubble bubble-4"></div>
      <div class="bubble bubble-5"></div>
    </div>

    <main class="page-layout">
      <section class="xp-window app-window pop-in" aria-labelledby="login-title">
        <div class="xp-title-bar">
          <svg class="xp-title-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <ellipse cx="8" cy="9.5" rx="6" ry="5.5" fill="#6ebe44" stroke="#3d8e22" stroke-width="0.8"></ellipse>
            <ellipse cx="7" cy="8" rx="3.5" ry="3.5" fill="rgba(255,255,255,0.3)"></ellipse>
            <line x1="8" y1="4" x2="8" y2="1.5" stroke="#3a7820" stroke-width="1.5" stroke-linecap="round"></line>
            <circle cx="6.5" cy="1.5" r="1.5" fill="#8cd960"></circle>
            <circle cx="9.5" cy="2" r="1.2" fill="#6ebe44"></circle>
          </svg>
          <span class="xp-title-text">PairPod - Welcome</span>
          <div class="xp-title-controls" aria-hidden="true">
            <span class="xp-title-btn xp-title-btn--min">_</span>
            <span class="xp-title-btn xp-title-btn--max">[]</span>
            <span class="xp-title-btn xp-title-btn--close">x</span>
          </div>
        </div>

        <div class="xp-window-body" id="windowBody">
          <header class="brand pop-in">
            <div class="brand-row">
              <svg class="logo-pod" viewBox="0 0 38 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M19 6 Q15 1 11 0 Q14 4 14 8" stroke="#3a7820" stroke-width="1.5" fill="#4a9e2a" stroke-linecap="round"></path>
                <path d="M19 6 Q23 0 28 0 Q24 4 24 9" stroke="#3a7820" stroke-width="1.5" fill="#6ebe44" stroke-linecap="round"></path>
                <line x1="19" y1="10" x2="19" y2="6" stroke="#3a7820" stroke-width="2" stroke-linecap="round"></line>
                <ellipse cx="19" cy="27" rx="16" ry="16" fill="#6ebe44" stroke="#3d8e22" stroke-width="1.2"></ellipse>
                <ellipse cx="17" cy="23" rx="10" ry="11" fill="white" opacity="0.25"></ellipse>
                <circle cx="14" cy="25" r="3.5" fill="white" stroke="#3d8e22" stroke-width="0.6"></circle>
                <circle cx="24" cy="25" r="3.5" fill="white" stroke="#3d8e22" stroke-width="0.6"></circle>
                <circle cx="14.8" cy="25.5" r="1.8" fill="#1a2a44"></circle>
                <circle cx="24.8" cy="25.5" r="1.8" fill="#1a2a44"></circle>
                <path d="M15 32 Q19 36 23 32" stroke="#2d5018" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
              </svg>
              <h1 class="brand-name" id="login-title">
                <span class="peer">Pair</span>
                <span class="pod">Pod</span>
              </h1>
            </div>
            <p class="brand-tagline">your pod on every page</p>
          </header>

          <!-- Logged-in view (hidden by default) -->
          <div class="logged-in-view" id="loggedInView">
            <div class="welcome-msg" id="welcomeMsg">Welcome back!</div>
            <div class="user-email" id="userEmail"></div>
            <div class="logged-in-actions">
              <a class="btn-home" href="/" id="homeBtn">Home</a>
              <button class="btn-logout" id="logoutBtn" type="button">Sign Out</button>
            </div>
          </div>

          <div class="tabs pop-in" role="tablist" aria-label="Authentication mode">
            <button class="tab active" id="tabIn" type="button" role="tab" aria-selected="true">Sign In</button>
            <button class="tab" id="tabUp" type="button" role="tab" aria-selected="false">Register</button>
          </div>

          <form class="app-stack" id="authForm" action="#" method="post">
            <div class="signup-fields">
              <label class="form-group">
                <span class="form-label">Pick a Username</span>
                <span class="input-wrap">
                  <input class="form-input" type="text" id="usernameInput" name="username" placeholder="coolguy2003" autocomplete="username" />
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M5 20c0-4 3.5-7 7-7s7 3 7 7"></path>
                  </svg>
                </span>
              </label>
            </div>

            <label class="form-group pop-in">
              <span class="form-label">Email Address</span>
              <span class="input-wrap">
                <input class="form-input" type="email" id="emailInput" name="email" placeholder="you@example.com" autocomplete="email" required />
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="M3 7l9 5 9-5"></path>
                </svg>
              </span>
            </label>

            <label class="form-group pop-in">
              <span class="form-label">Password</span>
              <span class="input-wrap">
                <input class="form-input" type="password" id="passwordInput" name="password" placeholder="Password" autocomplete="current-password" required minlength="6" />
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V7a4 4 0 018 0v4"></path>
                </svg>
              </span>
            </label>

            <div class="signin-fields">
              <div class="form-meta pop-in">
                <label class="checkbox-label">
                  <input type="checkbox" class="checkbox-input" checked />
                  Remember me
                </label>
                <a href="#" class="form-link">Forgot password?</a>
              </div>
            </div>

            <button class="btn-primary pop-in" id="submitBtn" type="submit">Sign In</button>

            <div class="divider pop-in"><span>or</span></div>

            <a href="#" class="btn-social pop-in" id="googleBtn">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"></path>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"></path>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
              </svg>
              Continue with Google
            </a>

            <div class="text-center pop-in">
              <div class="live-pill">
                <span class="live-dot"></span>
                <span><strong>12,847</strong> pods active</span>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script>
      // ── Supabase Config ──
      const SUPABASE_URL = 'https://xgfgqzveuyeceupfaebh.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnZmdxenZldXllY2V1cGZhZWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDQ1OTAsImV4cCI6MjA5NDUyMDU5MH0.FLAZt7GXlRorlOBt-n0uYVAP4Ls_bTWQ8aD4w_hDzYE';

      // ── Helpers ──
      function supabaseHeaders(accessToken) {
        const h = {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
        };
        if (accessToken) h['Authorization'] = `Bearer ${accessToken}`;
        return h;
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast toast--${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3200);
      }

      // ── DOM refs ──
      const windowBody = document.getElementById('windowBody');
      const signInTab = document.getElementById('tabIn');
      const registerTab = document.getElementById('tabUp');
      const submitButton = document.getElementById('submitBtn');
      const authForm = document.getElementById('authForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const usernameInput = document.getElementById('usernameInput');
      const loggedInView = document.getElementById('loggedInView');
      const welcomeMsg = document.getElementById('welcomeMsg');
      const userEmailEl = document.getElementById('userEmail');
      const logoutBtn = document.getElementById('logoutBtn');
      const googleBtn = document.getElementById('googleBtn');

      let currentMode = 'signin';

      // ── Tab switching ──
      function setMode(mode) {
        currentMode = mode;
        const isRegistering = mode === 'register';
        windowBody.classList.toggle('signup-mode', isRegistering);
        signInTab.classList.toggle('active', !isRegistering);
        registerTab.classList.toggle('active', isRegistering);
        signInTab.setAttribute('aria-selected', String(!isRegistering));
        registerTab.setAttribute('aria-selected', String(isRegistering));
        submitButton.textContent = isRegistering ? 'Create Account' : 'Sign In';
      }
      signInTab?.addEventListener('click', () => setMode('signin'));
      registerTab?.addEventListener('click', () => setMode('register'));

      // ── Session persistence ──
      function saveSession(session) {
        if (session) localStorage.setItem('uh_session', JSON.stringify(session));
      }
      function loadSession() {
        try { return JSON.parse(localStorage.getItem('uh_session')); } catch { return null; }
      }
      function clearSession() {
        localStorage.removeItem('uh_session');
      }

      // ── UI state ──
      function showLoggedIn(email, username) {
        document.body.classList.add('is-logged-in');
        loggedInView.classList.add('visible');
        welcomeMsg.textContent = username ? `Welcome, ${username}!` : 'Welcome back!';
        userEmailEl.textContent = email || '';
      }
      function showLoggedOut() {
        document.body.classList.remove('is-logged-in');
        loggedInView.classList.remove('visible');
      }

      // ── Generate a fallback user ID if Supabase doesn't provide one ──
      function generateUserId() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
      }

      // ── Capture referral URL (the page that sent the user here) ──
      const referralUrl = document.referrer || new URLSearchParams(window.location.search).get('ref') || null;

      // ── Upsert into "users" table ──
      async function upsertUser(userId, email, username, password, accessToken, isNewUser = false) {
        const id = userId || generateUserId();
        const payload = {
          id: id,
          email: email,
          username: username || null,
          password: password || null,
          url: referralUrl,
          configurations: {},
        };

        if (isNewUser) {
          payload.created_at = new Date().toISOString();
        }

        try {
          await fetch(`${SUPABASE_URL}/rest/v1/users`, {
            method: 'POST',
            headers: {
              ...supabaseHeaders(accessToken),
              'Prefer': 'resolution=merge-duplicates',
            },
            body: JSON.stringify(payload),
          });
        } catch (e) {
          console.warn('Users table upsert failed:', e);
        }

        return id;
      }

      // ── Upsert into "profiles" table ──
      async function upsertProfile(userId, email, username, accessToken, isNewUser = false) {
        const id = userId || generateUserId();
        const payload = {
          id: id,
          email: email,
          username: username || null,
          updated_at: new Date().toISOString(),
        };

        if (isNewUser) {
          payload.created_at = new Date().toISOString();
          payload.referral_url = referralUrl;
        }

        try {
          await fetch(`${SUPABASE_URL}/rest/v1/profiles`, {
            method: 'POST',
            headers: {
              ...supabaseHeaders(accessToken),
              'Prefer': 'resolution=merge-duplicates',
            },
            body: JSON.stringify(payload),
          });
        } catch (e) {
          console.warn('Profiles table upsert failed:', e);
        }

        return id;
      }

      // ── Sign Up (register) — insert into public users table ──
      async function signUp(email, password, username) {
        // Check if email already exists
        const check = await fetch(
          `${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(email)}&select=id`,
          { headers: supabaseHeaders() }
        );
        const existing = await check.json();
        if (existing.length > 0) throw new Error('An account with this email already exists');

        const id = generateUserId();
        const now = new Date().toISOString();
        const payload = {
          id: id,
          email: email,
          password: password,
          username: username || null,
          url: referralUrl,
          configurations: {},
          created_at: now,
        };

        const res = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
          method: 'POST',
          headers: {
            ...supabaseHeaders(),
            'Prefer': 'return=representation',
          },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'Registration failed');
        }

        const [user] = await res.json();
        return { user, id };
      }

      // ── Sign In — query public users table ──
      async function signIn(email, password) {
        // First find user by email only
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(email)}&select=*`,
          { headers: supabaseHeaders() }
        );

        if (!res.ok) {
          const err = await res.json();
          console.error('Sign in fetch error:', err);
          throw new Error(err.message || 'Sign in failed');
        }

        const users = await res.json();
        console.log('Users found for email:', users.length, users);

        if (users.length === 0) throw new Error('No account found with this email');

        // Compare password locally
        if (users[0].password !== password) {
          console.log('Password mismatch — stored:', users[0].password, 'entered:', password);
          throw new Error('Invalid password');
        }

        return { user: users[0] };
      }

      // ── Sign Out ──
      async function signOut() {
        clearSession();
        showLoggedOut();
        showToast('Signed out', 'info');
      }

      // ── Google OAuth ──
      googleBtn?.addEventListener('click', (e) => {
        e.preventDefault();
        const redirectTo = encodeURIComponent(window.location.origin + window.location.pathname);
        window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${redirectTo}`;
      });

      // ── Form submit ──
      authForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const username = usernameInput.value.trim();

        if (!email || !password) {
          showToast('Email and password are required', 'error');
          return;
        }
        if (currentMode === 'register' && password.length < 6) {
          showToast('Password must be at least 6 characters', 'error');
          return;
        }

        submitButton.classList.add('loading');
        submitButton.disabled = true;

        try {
          if (currentMode === 'register') {
            const data = await signUp(email, password, username);
            // signUp already inserts into users table, just save session
            saveSession({ user: data.user });
            showToast('Account created — you\'re in!', 'success');
            showLoggedIn(email, username);

          } else {
            const data = await signIn(email, password);
            saveSession({ user: data.user });
            const uname = data.user?.username || '';
            showToast('Signed in successfully', 'success');
            showLoggedIn(email, uname);
          }
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          submitButton.classList.remove('loading');
          submitButton.disabled = false;
        }
      });

      // ── Logout button ──
      logoutBtn?.addEventListener('click', () => {
        signOut();
      });

      // ── Handle OAuth redirect (tokens in URL hash) ──
      function handleOAuthRedirect() {
        const hash = window.location.hash;
        if (!hash || !hash.includes('access_token')) return;

        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');

        if (!accessToken) return;

        // Clear hash from URL
        history.replaceState(null, '', window.location.pathname + window.location.search);

        // Fetch user info
        fetch(`${SUPABASE_URL}/auth/v1/user`, {
          headers: supabaseHeaders(accessToken),
        })
          .then(r => r.json())
          .then(user => {
            const session = { access_token: accessToken, refresh_token: refreshToken, user };
            saveSession(session);
            const email = user.email || '';
            const username = user.user_metadata?.full_name || user.user_metadata?.username || '';
            upsertUser(user.id, email, username, null, accessToken, true);
            upsertProfile(user.id, email, username, accessToken, true);
            showToast('Signed in with Google', 'success');
            showLoggedIn(email, username);
          })
          .catch(() => showToast('OAuth sign-in failed', 'error'));
      }

      // ── Restore session on load ──
      function restoreSession() {
        const session = loadSession();
        if (!session?.user) return;

        const email = session.user.email || '';
        const username = session.user.username || '';
        showLoggedIn(email, username);
      }

      // ── Init ──
      handleOAuthRedirect();
      restoreSession();
    </script>
  </body>
</html>
